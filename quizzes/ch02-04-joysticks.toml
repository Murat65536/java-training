[[questions]]
type = "MultipleChoice"
prompt.prompt = """
The driver pushes the left stick all the way forward. What does `getLeftY()` give back?
"""
prompt.distractors = ["`1.0`", "`0.0`", "`100`"]
answer.answer = "`-1.0`"
context = """
For the Y axis, back is positive, so forward is negative. That's why you'll usually see `-controller.getLeftY()`, so that forward means positive.
"""
id = "f45e1ea3-a78f-4cc5-afbc-2f1203599ad6"

[[questions]]
type = "MultipleChoice"
prompt.prompt = """
Why does `manualControl` take a `DoubleSupplier` instead of a `double`?
"""
prompt.distractors = [
  "Because `runRepeatedly` can't use a `double`",
  "Because a `DoubleSupplier` is more precise",
  "Because joysticks give back `DoubleSupplier`s, not numbers",
]
answer.answer = "So it can ask where the stick is again every time around, instead of only once"
context = """
A `double` would only hold where the stick was when the command was made. The command asks the `DoubleSupplier` for a new number every time it runs, so the arm always follows where the stick is right now.
"""
id = "ab1d216b-4b94-4cfd-a454-5b6f02c63580"

[[questions]]
type = "MultipleChoice"
prompt.prompt = """
`manualControl` is the arm's default command. The driver presses the button for `moveTo(ArmPosition.SCORING)`, and the arm gets there. What happens next?
"""
prompt.distractors = [
  "The arm stays still until the robot is disabled",
  "The arm goes back to where it started",
  "`moveTo` runs again, because the button was pressed",
]
answer.answer = "`moveTo` finishes, and the arm goes back to following the left stick"
context = """
When `moveTo` finishes, nothing is using the arm, so the scheduler runs its default command again. That's `manualControl` now, so the driver has control of the arm again.
"""
id = "b0cce890-5fa6-415b-98c3-3a499196eabb"
