[[questions]]
type = "MultipleChoice"
prompt.prompt = """
What is `speed` after this code runs?

```java
int speed = 15;
if (speed > 10) {
    speed = 10;
} else if (speed > 5) {
    speed = 5;
}
```
"""
prompt.distractors = ["5", "15", "It's an error"]
answer.answer = "10"
context = """
`speed > 10` is `true`, so `speed = 10;` runs. Once one part runs, Java skips the rest, so the `else if` is never checked.
If these had been two separate if statements, the second one *would* have been checked, and `speed` would end up 5.
"""
id = "85cf64bb-ba03-470a-b673-7105f715a7c8"

[[questions]]
type = "MultipleChoice"
prompt.prompt = """
If `health` is 80, what is `bars` after this code runs?

```java
int bars = 0;
if (health > 0) {
    bars = 1;
} else if (health > 50) {
    bars = 2;
}
```
"""
prompt.distractors = ["2", "0", "It runs both, so it ends up 2 after being 1"]
answer.answer = "1"
context = """
Java checks the questions from top to bottom and stops at the first one that's `true`. 80 is greater than 0, so `bars = 1;` runs, and `health > 50` never gets checked.
Order matters. To get 2 here, `health > 50` would need to come first.
"""
id = "96f3389c-d85f-437b-8b8b-9bfed0ec2b7b"

[[questions]]
type = "MultipleChoice"
prompt.prompt = """
Here's a class:

```java
class Player {
    int x;

    void move(int steps) {
        x = x + steps;
        if (x < 0) {
            x = 0;
        } else if (x > 100) {
            x = 100;
        }
    }
}
```

What is `bob.x` after this code runs?

```java
Player bob = new Player();
bob.move(95);
bob.move(10);
```
"""
prompt.distractors = ["105", "95", "10"]
answer.answer = "100"
context = """
`bob` starts at 0, then moves to 95. Moving 10 more would put `bob` at 105, but `x > 100` is `true`, so `x` gets set back to 100.
"""
id = "6884a326-8c43-4f1e-81cd-e7270df66ed5"
