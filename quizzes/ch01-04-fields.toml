[[questions]]
type = "MultipleChoice"
prompt.prompt = "Which line puts `bob`'s health into a new variable named `h`?"
prompt.distractors = [
  "`int h = Player.health;`",
  "`int h = health.bob;`",
  "`int h = bob health;`",
]
answer.answer = "`int h = bob.health;`"
context = """
The object goes first, then `.`, then the field: `bob.health`.
`Player.health` doesn't work, because `Player` is the blueprint. The blueprint doesn't have a health, only the `Player`s you build from it do.
"""
id = "77d6c245-52c4-4512-bf57-274057ee5613"
