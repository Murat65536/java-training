[[questions]]
type = "MultipleChoice"
prompt.prompt = """
Here's a class:

```java
class Player {
    int health;
}
```

What is `alice.health` after this code runs?

```java
Player bob = new Player();
Player alice = new Player();
bob.health = 80;
alice.health = 20;
bob.health = 50;
```
"""
prompt.distractors = ["50", "80", "0"]
answer.answer = "20"
context = """
Each `Player` has its own `health`. Changing `bob.health` to 50 doesn't touch `alice.health`, which is still 20.
"""
id = "b127e508-a3e3-4337-a929-163d62ee493f"

